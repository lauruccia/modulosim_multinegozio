---
deployment:
  tasks:
    # Permessi storage e cache
    - /bin/chmod -R 775 /home/shars/repositories/modulosim_multinegozio/storage
    - /bin/chmod -R 775 /home/shars/repositories/modulosim_multinegozio/bootstrap/cache

    # Copia public/ in public_html
    - /bin/cp -R /home/shars/repositories/modulosim_multinegozio/public/. /home/shars/public_html/
    - /bin/cp /home/shars/repositories/modulosim_multinegozio/cpanel-public-index.php /home/shars/public_html/index.php

    # Symlink storage corretto in public_html (sovrascrive la copia statica)
    - /bin/ln -sfn /home/shars/repositories/modulosim_multinegozio/storage/app/public /home/shars/public_html/storage

    # Laravel: migration, cache, storage link
    - /usr/local/bin/php /home/shars/repositories/modulosim_multinegozio/artisan migrate --force --no-interaction
    - /usr/local/bin/php /home/shars/repositories/modulosim_multinegozio/artisan optimize:clear
    - /usr/local/bin/php /home/shars/repositories/modulosim_multinegozio/artisan route:cache
    - /usr/local/bin/php /home/shars/repositories/modulosim_multinegozio/artisan view:cache
